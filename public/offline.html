<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline — DSM Helper</title>
<meta name="theme-color" content="#0284c7">
<style>
  *{box-sizing:border-box}html,body{height:100%;margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
  body{display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#0f172a;padding:24px}
  .card{max-width:420px;width:100%;background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:28px;text-align:center;box-shadow:0 8px 30px rgba(2,132,199,.08)}
  .logo{width:64px;height:64px;border-radius:16px;margin:0 auto 16px;background:linear-gradient(135deg,#0284c7,#3b82f6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:36px}
  h1{font-size:18px;margin:0 0 8px} p{font-size:13px;color:#64748b;line-height:1.6;margin:0 0 16px}
  a{display:inline-flex;align-items:center;gap:6px;background:#0284c7;color:#fff;text-decoration:none;padding:10px 18px;border-radius:999px;font-weight:600;font-size:13px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">S</div>
    <h1>Bạn đang offline</h1>
    <p>DSM Helper cần kết nối để đồng bộ với NAS. Kiểm tra mạng rồi thử lại. Dữ liệu đã cache vẫn hiển thị khi có thể.</p>
    <a href="/">Thử lại</a>
  </div>
</body>
</html>
