name: KVSynology
options:
  bundleIdPrefix: com.khoavo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"

packages:
  KVSynologyCore:
    path: .

targets:
  KVSynology:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/KVSynologyApp
      - path: Sources/KVSynologyCore
    dependencies:
      - framework: SwiftUI.framework
      - framework: Combine.framework
      - framework: Charts.framework
      - framework: LocalAuthentication.framework
      - framework: Security.framework
      - framework: AVFoundation.framework
      - framework: QuickLook.framework
    settings:
      base:
        PRODUCT_NAME: "KV-Synology"
        PRODUCT_BUNDLE_IDENTIFIER: "com.khoavo.kvsynology"
        INFOPLIST_FILE: Sources/KVSynologyApp/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO

  KVSynologyCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/KVSynologyCoreTests
    dependencies:
      - target: KVSynology
