[package]
name = "api-snmp-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of src/app/api/snmp/{discover,query}/route.ts and src/lib/snmp/server.ts"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
snmp-presets-rs = { path = "../snmp-presets-rs" }
snmp2 = { version = "0.5", features = ["tokio", "crypto-rust", "v3", "heap_buffers"] }
tokio = { version = "1", features = ["net", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
