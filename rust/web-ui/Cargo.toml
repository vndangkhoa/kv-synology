[package]
name = "kv-synology-web-ui"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-net = "0.8"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "DomTokenList",
    "Storage",
    "MediaQueryList",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "MouseEvent",
    "Location",
    "Navigator",
    "Clipboard",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "Performance",
    "console",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
