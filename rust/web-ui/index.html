<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0064E0" />
  <meta name="description" content="Web application for managing Synology DiskStation Manager (DSM) in Vietnamese and English — Pure Rust Edition" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DSM Helper" />
  <title>DSM Helper - Quản lý Synology NAS</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script>
    try {
      const t = localStorage.getItem('dsm_theme') || 'system';
      const m = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (t === 'gemini' || (t === 'system' && m)) {
        document.documentElement.classList.add('dark', 'gemini');
      } else if (t === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('gemini');
      } else {
        document.documentElement.classList.remove('dark', 'gemini');
      }
    } catch {}
  </script>
  <link data-trunk rel="css" href="styles/output.css" />
  <link data-trunk rel="rust" data-wasm-opt="0" />
  <link data-trunk rel="copy-file" href="../../public/manifest.json" />
  <link data-trunk rel="copy-file" href="../../public/logo.svg" />
  <link data-trunk rel="copy-file" href="../../public/favicon.ico" />
  <link data-trunk rel="copy-file" href="../../public/favicon-16x16.png" />
  <link data-trunk rel="copy-file" href="../../public/favicon-32x32.png" />
  <link data-trunk rel="copy-file" href="../../public/apple-touch-icon.png" />
  <link data-trunk rel="copy-file" href="../../public/icon-192.png" />
  <link data-trunk rel="copy-file" href="../../public/icon-512.png" />
  <link data-trunk rel="copy-file" href="../../public/icon-maskable.svg" />
  <link data-trunk rel="copy-file" href="../../public/sw.js" />
  <link data-trunk rel="copy-file" href="../../public/offline.html" />
  <link data-trunk rel="copy-dir" href="../../public/icons" />
</head>
<body class="antialiased min-h-screen ax-body selection:bg-sky-500 selection:text-white">
  <noscript>Vui lòng bật JavaScript / WebAssembly để sử dụng DSM Helper.</noscript>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
