[package]
name = "api-traffic-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of src/app/api/traffic/connections/route.ts and src/lib/traffic/realSocketService.ts"

[lib]
crate-type = ["rlib"]

[dependencies]
api-geoip-rs = { path = "../api-geoip-rs" }
geoip-helpers-rs = { path = "../geoip-helpers-rs" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
