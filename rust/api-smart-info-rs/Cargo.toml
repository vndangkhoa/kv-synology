[package]
name = "api-smart-info-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of src/app/api/storage/smart-info/route.ts"

[lib]
crate-type = ["rlib"]

[dependencies]
api-ssh-rs = { path = "../api-ssh-rs" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
syno-smart-parser-rs = { path = "../syno-smart-parser-rs" }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
