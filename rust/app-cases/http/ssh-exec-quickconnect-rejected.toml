[request]
method = "POST"
path = "/api/ssh/exec"
body = '{"host":"mynas.quickconnect.to","username":"admin","command":"uname -a"}'

[request.headers]
content-type = "application/json"

[response]
status = 400

[response.headers]
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch"
