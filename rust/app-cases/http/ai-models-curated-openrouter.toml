[request]
method = "POST"
path = "/api/ai/models"
body = '{"provider":"openrouter"}'

[request.headers]
content-type = "application/json"

[response]
status = 200

[response.headers]
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch"
