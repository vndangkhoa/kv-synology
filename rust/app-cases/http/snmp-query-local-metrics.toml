[request]
method = "POST"
path = "/api/snmp/query"
body = '{"host":"127.0.0.1","credentials":{"version":"v2c","community":"public"},"sensors":[{"id":"cpu","name":"CPU","kind":"cpu_usage"},{"id":"ram","name":"RAM","kind":"ram_usage"},{"id":"up","name":"Uptime","kind":"uptime"}]}'

[request.headers]
content-type = "application/json"

[response]
status = 200

[response.headers]
content-type = "application/json"
vary = "rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch"
