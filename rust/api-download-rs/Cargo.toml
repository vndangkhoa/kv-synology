[package]
name = "api-download-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of src/app/api/download/{bt-search,resolve-link,rss-fetch}/route.ts"

[lib]
crate-type = ["rlib"]

[dependencies]
chrono = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
